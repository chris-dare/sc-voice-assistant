<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Zigi Voice POC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%23ffcb05%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 font-family=%22sans-serif%22 font-weight=%22700%22 text-anchor=%22middle%22%3EZ%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="phone" aria-label="Zigi assistant">
    <header class="topbar">
      <div class="brand">
        <span class="avatar" aria-hidden="true">Z</span>
        <div>
          <h1>Zigi</h1>
          <p id="status-line" class="sub">Connecting…</p>
        </div>
      </div>
      <div class="mode-toggle" role="tablist" aria-label="Mode">
        <button role="tab" id="tab-chat" aria-selected="true" aria-controls="view-chat">Chat</button>
        <button role="tab" id="tab-voice" aria-selected="false" aria-controls="view-voice">Voice</button>
      </div>
    </header>

    <section id="view-chat" class="view" role="tabpanel" aria-labelledby="tab-chat">
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <div id="note-hint" class="note-hint" hidden>Voice note transcribed. Check it, then send.</div>
      <div id="attach-tray" class="attach-tray" aria-label="Attachments to send" hidden></div>
      <form id="composer" class="composer" autocomplete="off">
        <button type="button" id="plus-btn" class="icon-btn ghost" aria-label="Add photos and files" aria-haspopup="menu" aria-expanded="false" aria-controls="attach-menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        </button>
        <div id="recording" class="recording" hidden><span class="dot"></span><span id="rec-time">0:00</span> Recording… tap to stop</div>
        <textarea id="input" rows="1" placeholder="Ask Zigi" aria-label="Message"></textarea>
        <button type="button" id="note-btn" class="icon-btn ghost" aria-label="Record a voice note" title="Record a voice note">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <button type="submit" id="send-btn" class="icon-btn round primary" aria-label="Send" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 20V7.83l-5.59 5.59L4 12l8-8 8 8-1.41 1.41L13 7.83V20z"/></svg>
        </button>
        <button type="button" id="voice-mode-btn" class="icon-btn round accent" aria-label="Start voice chat" title="Voice chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9h2v6H7zM11 6h2v12h-2zM15 8h2v8h-2zM3 11h2v2H3zM19 11h2v2h-2z"/></svg>
        </button>
      </form>
      <div id="attach-menu" class="attach-menu" role="menu" aria-label="Add" hidden>
        <button type="button" role="menuitem" id="menu-camera"><span class="mi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3 7.17 5H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.17L15 3H9Zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/></svg></span>Camera</button>
        <button type="button" role="menuitem" id="menu-photos"><span class="mi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 16H5v-2.59l4-4 3 3 4-4 3 3V19Zm0-6.41-3-3-4 4-3-3-4 4V5h14v7.59ZM15.5 10a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg></span>Photos</button>
        <button type="button" role="menuitem" id="menu-files"><span class="mi-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1 1 0 0 1-2 0V6H10v9.5a2.5 2.5 0 0 0 5 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h-1.5Z"/></svg></span>Files</button>
      </div>
      <input type="file" id="pick-camera" accept="image/*" capture="environment" hidden />
      <input type="file" id="pick-photos" accept="image/*" multiple hidden />
      <input type="file" id="pick-files" accept="image/*,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx" multiple hidden />
      <!-- iPhone/iPad: one input that opens Apple's own sheet (Photo Library, Take Photo, Choose Files). -->
      <input type="file" id="pick-ios" accept="image/*,.pdf,.txt,.csv,.doc,.docx,.xls,.xlsx,.ppt,.pptx" multiple hidden />
      <dialog id="camera-dialog" class="camera-dialog" aria-label="Take a photo">
        <video id="camera-video" playsinline autoplay muted></video>
        <div class="camera-actions">
          <button type="button" id="camera-cancel" class="pill-btn">Cancel</button>
          <button type="button" id="camera-shoot" class="shutter" aria-label="Take photo"></button>
          <button type="button" id="camera-flip" class="pill-btn" aria-label="Switch camera">Flip</button>
        </div>
      </dialog>
    </section>

    <section id="view-voice" class="view" role="tabpanel" aria-labelledby="tab-voice" hidden>
      <div class="voice-stage">
        <div id="orb" class="orb" data-state="idle" aria-hidden="true"><div class="ring"></div><div class="core"></div></div>
        <p id="voice-state" class="voice-state" aria-live="polite">Tap to start talking</p>
        <p id="caption-user" class="caption user" aria-live="polite"></p>
        <p id="caption-bot" class="caption bot" aria-live="polite"></p>
      </div>
      <div class="voice-controls">
        <button id="voice-btn" class="voice-btn" aria-pressed="false">Start voice chat</button>
        <button id="mute-btn" class="icon-btn" aria-pressed="false" aria-label="Mute microphone" title="Mute microphone" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
      </div>
      <dl id="metrics" class="metrics" aria-label="Last turn timings"></dl>
    </section>
    <div id="toast" class="toast" role="status" hidden></div>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
